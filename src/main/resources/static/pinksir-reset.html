<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>紧急重置 PINKSIR</title><link rel="stylesheet" href="auth.css?v=20261008-simple-login"></head>
<body><main class="auth-page"><section class="auth-card login-card"><div class="brand-mark">W</div><header class="auth-heading"><span class="eyebrow">LOCAL EMERGENCY RESET</span><h1>重置 PINKSIR 密码</h1><p>此入口仅允许服务器本机访问，不验证旧密码。重置后已有登录会话继续有效。</p></header><form id="resetForm" class="auth-form"><label>新密码<input id="newPassword" type="password" required minlength="8" autocomplete="new-password"></label><label>确认新密码<input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password"></label><p class="form-error" id="resetError" hidden></p><p class="success-note" id="resetSuccess" hidden></p><button class="primary-action" type="submit">确认重置</button></form><a class="back-link" href="/login.html">返回登录</a></section></main><script src="pinksir-reset.js?v=20261008-simple-login"></script></body>
</html>
